service:
  app:
    build: ./backend
    ports: 
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/data:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 ---port 8000 --reload

  frontend:
    image: node:20-alpine
    working_dir: /web
    port:
      - "5173:5173"
    environment: 
      - VITE_API_TARGET=http://app:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - app