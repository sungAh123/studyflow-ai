services:
  app:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports: 
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    working_dir: /web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/web
      - /web/node_modules
    environment: 
      - VITE_API_TARGET=http://app:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - app