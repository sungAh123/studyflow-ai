services:
  app:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports: 
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on: 
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    image: node:20-alpine
    working_dir: /web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/web
      - /web/node_modules
    environment: 
      - VITE_API_TARGET=http://app:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - app

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    profiles:
      - test
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: sh -c "pip install -q -r requirements-dev.txt && pytest -v"

volumes:
  ollama_data: